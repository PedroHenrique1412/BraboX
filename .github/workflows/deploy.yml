name: Publicar site PHP no InfinityFree (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_NODE_JAVASCRIPT_ACTIONS: true

concurrency:
  group: publicar-infinityfree-main
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validar sintaxe dos arquivos PHP
        run: |
          find . -type f -name "*.php" ! -path "./.git/*" -print0 | while IFS= read -r -d '' arquivo; do
            php -l "$arquivo"
          done

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            README.md
